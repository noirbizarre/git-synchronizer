min_version = "2026.1.1"

[settings]
# Resolve tools through mise.lock and keep it updated. Without this the
# lockfile is ignored and `latest` really means latest — which would let
# git-cliff change between releases and silently change our release notes.
lockfile = true

# Do not let mise adopt `rust-toolchain.toml`. Rust is installed by rustup
# locally and by `dtolnay/rust-toolchain` in CI, which handle the per-job
# components and the cross-compilation targets that mise does not. Without
# this, `mise-action` would install a redundant second toolchain in every
# workflow that uses it.
idiomatic_version_file_enable_tools = []

[tools]
prek = "latest"
cargo-binstall = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-llvm-cov" = "latest"
# The release toolchain. git-cliff derives both the next version and the
# changelog; typos is invoked by cliff.toml as a commit preprocessor.
git-cliff = "latest"
typos = "latest"
actionlint = "latest"

[tasks.build]
description = "Build the project"
run = "cargo build"

[tasks."build:release"]
description = "Build in release mode"
run = "cargo build --release"

[tasks.test]
description = "Run tests with nextest"
run = "cargo nextest run"

[tasks.cover]
description = "Run tests with coverage"
run = "cargo llvm-cov nextest --lcov --output-path lcov.info"

[tasks."cover:html"]
description = "Generate HTML coverage report"
run = "cargo llvm-cov nextest --html"

[tasks.lint]
description = "Run clippy"
# Must stay identical to the clippy hook in prek.toml, which is what CI
# enforces: linting only the default target/feature set here would let lints in
# tests, benches or feature-gated code pass locally and fail in CI.
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.fmt]
description = "Format code"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Check code formatting"
run = "cargo fmt --all -- --check"

[tasks.check]
description = "Run all checks"
depends = ["fmt-check", "lint", "test"]

[tasks."lint:actions"]
description = "Lint the GitHub Actions workflows"
# Rules and exclusions live in .github/actionlint.yml, so this task, the prek
# hook and a bare `actionlint` all behave identically.
run = "actionlint"

[tasks.changelog]
description = "Preview the changelog and version for the next release"
run = """
git cliff --bumped-version
git cliff --bump --unreleased
"""

[tasks."ship:validate"]
description = "Validate this repository's gh-ship release setup"
run = "gh ship validate"

[tasks.setup]
description = "Install locally"
run = "cargo install --path . --force"

# --- Artwork ----------------------------------------------------------------
#
# Not part of `default` or `check`: it rewrites a committed binary, so a routine
# run would dirty the working tree every time. Run it when the artwork changes,
# i.e. after editing logo.svg, since the social preview embeds the logo.

[tasks.social]
description = "Render the GitHub social preview image"
# GitHub has no API for the social preview, so this is generated here and
# uploaded by hand, once, under:
#   Settings -> General -> Social preview
#
# The canvas lives in social-preview.svg rather than being passed as flags:
# resvg scales to fit rather than padding, so --width 1280 --height 640 on a
# non-2:1 source yields the wrong size, not GitHub's required 1280x640.
#
# resvg is declared on the task rather than in `[tools]` because `mise install`
# — what CI runs — installs `[tools]` only, and cargo-binstall has no prebuilt
# artifact for resvg: a global entry would make every CI job build it from
# source.
tools = { "cargo:resvg" = "latest" }
run = """
resvg docs/images/social-preview.svg docs/images/social-preview.png
echo "docs/images/social-preview.png — upload under Settings > General > Social preview"
"""
