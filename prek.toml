default_install_hook_types = ["pre-commit", "commit-msg"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "end-of-file-fixer", exclude_types = ["rust"] },
  { id = "mixed-line-ending" },
  { id = "trailing-whitespace" },
]

[[repos]]
repo = "https://github.com/alessandrojcm/commitlint-pre-commit-hook"
rev = "v9.21.0"

[[repos.hooks]]
id = "commitlint"
stages = ["commit-msg"]
additional_dependencies = ["@commitlint/config-conventional"]


[[repos]]
repo = "local"

[[repos.hooks]]
id = "fmt"
name = "cargo fmt"
language = "system"
entry = "cargo fmt --all -- --check"
files = "\\.rs$"
pass_filenames = false

[[repos.hooks]]
id = "clippy"
name = "cargo clippy"
language = "system"
# Must stay identical to [tasks.lint] in mise.toml. Kept as a direct cargo
# invocation rather than `mise run lint` because cargo is on PATH via rustup,
# unlike the mise-managed tools below.
entry = "cargo clippy --all-targets --all-features -- -D warnings"
files = "\\.rs$"
pass_filenames = false

# The release runs entirely on workflows, so a typo in one is only discovered
# when a release is already under way. Configuration, including which checks
# are silenced and why, lives in .github/actionlint.yml.
#
# `system`, like the hooks above, but routed through mise: unlike cargo, which
# rustup puts on PATH, actionlint exists only as a mise-managed tool. Going via
# `mise exec` runs the version mise.lock pins whether or not the caller's shell
# has mise activated — a git hook usually does not.
[[repos.hooks]]
id = "actionlint"
name = "actionlint"
language = "system"
entry = "mise exec -- actionlint"
files = "^\\.github/(workflows/.*\\.ya?ml|actionlint\\.ya?ml)$"
pass_filenames = false
