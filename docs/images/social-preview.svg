<svg viewBox="0 0 1280 640" width="1280" height="640" xmlns="http://www.w3.org/2000/svg">
  <!-- GitHub social preview: 1280x640, generated by `mise run social`.
       The logo is referenced rather than duplicated, so the two cannot drift.
       This file is only ever rasterized locally, never served, so the nested
       SVG reference is safe here in a way it would not be in a served asset.
       The background is opaque because transparency renders black on most
       social cards.

       The <image> box keeps logo.svg's own 1719:287 ratio, so the mark is not
       distorted. The tagline is a <text> element: this is rasterized on one
       machine and uploaded by hand, so a missing font is visible to the person
       running the task rather than silently shipped. The fallback chain ends in
       a family every platform has. -->
  <rect width="1280" height="640" fill="#FFFFFF"/>
  <image href="logo.svg" x="140" y="185" width="1000" height="167"/>
  <text x="640" y="445" text-anchor="middle"
        font-family="Fira Sans, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="40" fill="#fc3c10">Easily synchronize your local branches and worktrees</text>
</svg>
