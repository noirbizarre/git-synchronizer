<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="130.697 41.364 998.656 287.179" width="999" height="287">
  <!-- Wordmark source. `mise run logo` flattens this into docs/images/logo.svg
       with usvg, which converts <text> into <path>: the committed logo is
       therefore font-independent, and this is the file you edit when the name
       changes.

       The mark is carried over verbatim from the pre-rename logo — it spells
       nothing, so it survived the rename untouched. Only the lettering was
       re-set. "git" is orange and the remainder black, the same colour split
       the original wordmark used.

       Two numbers are tuned rather than obvious:
       - font-size 173 puts Fira Sans Bold's x-height at 94.8, the x-height of
         the original lettering, so the wordmark sits beside the mark at the
         weight it always did.
       - letter-spacing 5 matches the original's looser tracking; without it
         the mark reads noticeably tighter than it used to.

       usvg preserves the viewBox rather than fitting it, so the viewBox above
       is maintained by hand: it is the flattened geometry's bounding box grown
       by 10.636 on every side, the padding the original logo used. After
       changing the text, re-measure the flattened output and update it, or the
       mark will sit off-centre in social-preview.svg. -->
