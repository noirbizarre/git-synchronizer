name: ♻️ CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: 🕵️ Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Pinned to an exact release on purpose: prek-action stopped publishing
      # moving major tags in v3, so `@v3` does not resolve.
      - uses: j178/prek-action@v3.0.0

  test:
    name: 🧪 Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      # worktrunk (`wt`) is required by the worktrunk integration tests;
      # without it they skip and leave the code paths uncovered.
      #
      # `--force` is mandatory: rust-cache restores cargo's installed-package
      # metadata but not `~/.cargo/bin`, so binstall would otherwise report
      # worktrunk as "already installed" and skip it, leaving `wt` off PATH.
      # `wt --version` then fails the job instead of silently losing coverage.
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall --no-confirm --force worktrunk
      - run: wt --version
      - run: cargo llvm-cov nextest --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info

  # gh-ship releases git-synchronizer. Its configuration and the workflows it
  # names must satisfy the contract gh-ship enforces, or the release breaks at
  # the worst possible moment. This catches that on a pull request instead.
  ship:
    name: 🚢 Ship setup
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Install gh-ship
        run: gh extension install noirbizarre/gh-ship

      - name: Validate the release setup
        run: gh ship validate
