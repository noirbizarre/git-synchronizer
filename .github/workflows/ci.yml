name: ♻️ CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: 🕵️ Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: j178/prek-action@v2

  test:
    name: 🧪 Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      # worktrunk (`wt`) is required by the worktrunk integration tests;
      # without it they skip and leave the code paths uncovered.
      #
      # `--force` is mandatory: rust-cache restores cargo's installed-package
      # metadata but not `~/.cargo/bin`, so binstall would otherwise report
      # worktrunk as "already installed" and skip it, leaving `wt` off PATH.
      # `wt --version` then fails the job instead of silently losing coverage.
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall --no-confirm --force worktrunk
      - run: wt --version
      - run: cargo llvm-cov nextest --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
